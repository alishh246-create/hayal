<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Book Your Event - Hayal Events</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Great+Vibes&display=swap" rel="stylesheet" />
<style>
  body { font-family: 'Poppins', sans-serif; background:#f7f5f2; margin:0; color:#333; }
  header { background:#7a0404; text-align:center; color:white; padding:80px 20px; font-family:'Great Vibes', cursive; font-size:3rem; }
  .container { max-width:700px; margin:40px auto; padding:20px; background:white; border-radius:15px; box-shadow:0 10px 25px rgba(0,0,0,0.1); }
  label { display:block; margin:15px 0 5px; font-weight:600; }
  input, select, textarea { width:100%; padding:12px; border-radius:10px; border:1px solid #ccc; font-size:1rem; }
  .btn { background:#7a0404; color:white; border:none; padding:12px 20px; border-radius:30px; cursor:pointer; margin-top:20px; font-size:1.1rem; }
  .btn:hover { background:#500303; transform:scale(1.05); transition:0.3s; }
</style>
</head>
<body>

<header>Book Your Event</header>

<div class="container">
  <form id="bookingForm">
    <label>Name</label>
    <input type="text" name="name" required />

    <label>Email</label>
    <input type="email" name="email" required />

    <label>Phone</label>
    <input type="tel" name="phone" required />

    <label>Event Date</label>
    <input type="date" name="date" required />

    <label>Number of Guests</label>
    <input type="number" name="guests" required />

    <label>Package</label>
    <select name="package" required>
      <option value="Gold">Gold Package</option>
      <option value="Diamond">Diamond Package</option>
      <option value="Premium">Premium Package</option>
    </select>

    <label>Special Requests</label>
    <textarea name="requests" rows="4"></textarea>

    <button type="submit" class="btn">Send Booking Request</button>
  </form>
</div>

<script>
  document.getElementById('bookingForm').addEventListener('submit', function(e){
    e.preventDefault();
    alert('Thank you! Your booking request has been received. Our team will contact you soon.');
    this.reset();
  });
</script>

</body>
</html>
