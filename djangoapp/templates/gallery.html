  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Great+Vibes&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background-color: #111;
      color: #eee;
    }

    header {
      background: linear-gradient(135deg, #ff0000, #333);
      text-align: center;
      padding: 40px 20px;
    }

    header h1 {
      font-family: 'Great Vibes', cursive;
      font-size: 3.5rem;
      color: #fff;
      text-shadow: 0px 0px 10px rgba(255,0,0,0.7);
      margin: 0;
    }

    /* Gallery Grid */
    .gallery {
      padding: 40px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .gallery img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      border-radius: 10px;
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    .gallery img:hover {
      transform: scale(1.07);
      box-shadow: 0 0 20px rgba(255,0,0,0.6);
    }
    /* Top Button */
#topBtn {
  position: fixed;
  bottom: 70px;
  right: 20px;
  padding: 10px 15px;
  background: #333;
  color: white;
  border: none;
  border-radius: 50%;
  cursor: pointer;
  display: none;
}

    /* Back Button */
    .back-link {
      display: inline-block;
      margin: 30px auto;
      text-decoration: none;
      background: #ff0000;
      color: white;
      padding: 12px 25px;
      border-radius: 25px;
      transition: 0.3s;
      font-weight: bold;
    }

    .back-link:hover {
      background: #cc0000;
      transform: scale(1.1);
    }
    footer {
      text-align: center;
      padding: 20px;
      background: #222;
      color: #aaa;
      border-top: 2px solid #ff0000;
    }
  </style>
</head>
