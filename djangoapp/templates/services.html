<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Services - Hayal Events</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Great+Vibes&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background-color: #111; /* dark background */
      color: #eee;
    }

    header {
      background: linear-gradient(135deg, #ff0000, #333);
      text-align: center;
      padding: 40px 20px;
    }

    header h1 {
      font-family: 'Great Vibes', cursive;
      font-size: 3.5rem;
      color: #fff;
      text-shadow: 0px 0px 10px rgba(255,0,0,0.7);
      margin: 0;
    }

    section {
      padding: 50px 80px;
    }

    h2 {
      font-family: 'Great Vibes', cursive;
      font-size: 2.8rem;
      color: #ff4d4d;
      text-align: center;
      margin-bottom: 30px;
      text-shadow: 0 0 10px rgba(255,0,0,0.4);
      position: relative;
    }

    h2::after {
      content: '';
      width: 100px;
      height: 3px;
      background: #ff4d4d;
      display: block;
      margin: 10px auto 0;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .gallery img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      border-radius: 10px;
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    .gallery img:hover {
      transform: scale(1.07);
      box-shadow: 0 0 20px rgba(255,0,0,0.6);
    }

    footer {
      text-align: center;
      padding: 20px;
      background: #222;
      color: #aaa;
      border-top: 2px solid #ff0000;
    }

   /* Back Button */
    .back-link {
      display: inline-block;
      margin: 30px auto;
      text-decoration: none;
      background: #ff0000;
      color: white;
      padding: 12px 25px;
      border-radius: 25px;
      transition: 0.3s;
      font-weight: bold;
    }

    .back-link:hover {
      background: #cc0000;
      transform: scale(1.1);
    }
  </style>

</head>
<body>

  <header>
    <h1>Our Services</h1>
  </header>

  <!-- 💍 WEDDING SECTION -->
  <section>
    <h2>💍 Wedding Events</h2>
    <div class="gallery">
      <img src="/static/images/wed1.jpg" alt="Wedding 1">
      <img src="/static/images/wed2.jpg" alt="Wedding 2">
      <img src="/static/images/v.webp" alt="Wedding 3">
      <img src="/static/images/wed41.jpg" alt="Wedding 4">
      <img src="/static/images/wed5.jpg" alt="Wedding 5">
      <img src="/static/images/r.jpg" alt="Wedding 6">
      <img src="/static/images/e.jfif" alt="Wedding 7">
      <img src="/static/images/s.jpg" alt="Wedding 8">
    </div>
  </section>

  <!-- 🎂 BIRTHDAY SECTION -->
  <section>
    <h2>🎂 Birthday Celebrations</h2>
    <div class="gallery">
      <img src="/static/images/q.jpg" alt="Birthday 1">
      <img src="/static/images/w.jfif" alt="Birthday 2">
      <img src="/static/images/g.webp" alt="Birthday 3">
      <img src="/static/images/aa.jfif" alt="Birthday 4">
      <img src="/static/images/bb.jfif" alt="Birthday 5">
      <img src="/static/images/dd.jfif" alt="Birthday 6">
      <img src="/static/images/ee.jfif" alt="Birthday 7">
      <img src="/static/images/cc.jfif" alt="Birthday 8">
    </div>
  </section>

  <!-- 🏢 CORPORATE SECTION -->
  <section>
    <h2>🏢 Corporate Events</h2>
    <div class="gallery">
      <img src="/static/images/ff.webp" alt="Corporate 1">
      <img src="/static/images/hh.avif" alt="Corporate 2">
      <img src="/static/images/nn.jpg" alt="Corporate 3">
      <img src="/static/images/kk.jpg" alt="Corporate 4">
      <img src="/static/images/mm.jpg" alt="Corporate 5">
      <img src="/static/images/gg.webp" alt="Corporate 6">
      <img src="/static/images/ll.jpg" alt="Corporate 7">
      <img src="/static/images/ii.jfif" alt="Corporate 8">
    </div>
  </section>
<div style="text-align:center;">
   <a href="{% url 'index' %}" class="back-link">⬅️ Back to Home</a>



  </div>

  <footer>
    © 2025 Hayal Events | Red & Black Elegance Theme
  </footer>

</body>
</html>
